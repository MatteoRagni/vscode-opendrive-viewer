name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint

      - name: Package extension
        run: npx vsce package --out vscode-opendrive-viewer.vsix

      - uses: actions/upload-artifact@v5
        with:
          name: vsix
          path: vscode-opendrive-viewer.vsix
